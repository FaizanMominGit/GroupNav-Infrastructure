name: GroupNav Infrastructure CI/CD

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to check out repository code
  pull-requests: write # Optional: allows commenting cdk diff on pull requests

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::325313611329:role/GroupNav-GitHubActionsDeployRole

jobs:
  test-and-diff:
    name: Test & Plan (CDK Diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Synthesize CloudFormation templates
        run: npx cdk synth

      - name: Run CDK Diff across stacks
        run: npx cdk diff || true

  deploy:
    name: Deploy & Export Client Config
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Synthesize CloudFormation templates
        run: npx cdk synth

      - name: Deploy CDK Stacks
        run: npx cdk deploy --all --require-approval never

      - name: Export Client Configuration
        run: npm run export-config

      - name: Upload Client Configuration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-config
          path: client-config.json
          retention-days: 30
